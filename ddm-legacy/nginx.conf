server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # API 代理到本地後端
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端
    location / {
        try_files $uri $uri/ /index.html;
    }
}