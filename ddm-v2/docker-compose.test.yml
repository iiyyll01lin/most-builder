# ─── docker-compose.test.yml — Integrated E2E test stack ─────────────────────
#
# Spins up PostgreSQL, the backend, and the frontend on a shared bridge network.
# The frontend Nginx proxies /api/* and WebSocket traffic to the backend.
# Playwright's globalSetup runs `docker compose -f docker-compose.test.yml up`
# before the test suite and tears it down via globalTeardown.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build -d
#   (Playwright globalSetup does this automatically)

name: ddm-v2-e2e

services:
  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ddm-v2-postgres-test
    environment:
      POSTGRES_USER: ddm
      POSTGRES_PASSWORD: ddm_secret
      POSTGRES_DB: ddm_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddm -d ddm_test"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - app_net
    restart: "no"
  # ── Redis 7 (Celery broker for E2E tests) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ddm-v2-redis-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app_net
    restart: "no"
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ddm-v2-backend:test
    container_name: ddm-v2-backend-test
    environment:
      DDM_ROOT_DIR: /app
      DDM_DATA_DIR: /app/data
      DDM_DATABASE_URL: postgresql+asyncpg://ddm:ddm_secret@postgres:5432/ddm_test
      # Retain legacy path so the JsonStore (still active during Phase 1-2)
      # can bootstrap default seed data from seeds.py if the file is absent.
      DDM_DB_PATH: /app/data/runtime-db.json
      # Fixed secret key so JWT tokens are stable across restarts
      DDM_SECRET_KEY: e2e-test-secret-key-not-for-production
      DDM_CORS_ALLOW_ORIGINS: "http://localhost:3000,http://frontend"
      DDM_CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE"
      DDM_CORS_ALLOW_HEADERS: "Authorization,Content-Type"
      DDM_CORS_ALLOW_CREDENTIALS: "true"
      DDM_CELERY_BROKER_URL: redis://redis:6379/0
      DDM_CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - e2e_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
    restart: "no"

  # ── Nginx + Vite static frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: ddm-v2-frontend:test
    container_name: ddm-v2-frontend-test
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - app_net
    restart: "no"

volumes:
  # Named volume provides an isolated writable data directory for the backend.
  # The backend will bootstrap default seed data via seeds.py on first start.
  e2e_data:

networks:
  app_net:
    driver: bridge

