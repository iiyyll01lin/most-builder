# ─── Nginx configuration for DDM-V2 SPA + API reverse proxy ──────────────────
#
# Routing strategy:
#   1. /api/v1/simulation/ws/*  → WebSocket upgrade to backend:8000
#   2. /api/*                   → HTTP reverse proxy to backend:8000
#   3. /*                       → Serve Vite static build; fallback to index.html
#      for React client-side routing (HTML5 pushState).

server {
    listen 80;
    server_name _;

    # Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # ── WebSocket upgrade (must be BEFORE the /api/ block) ─────────────────────
    location /api/v1/simulation/ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep the socket alive for long-running simulations
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── REST API proxy ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large request bodies (SOP action lists)
        client_max_body_size 10m;
    }

    # ── React SPA — HTML5 pushState fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
