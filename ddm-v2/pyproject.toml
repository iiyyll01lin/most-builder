[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddm-v2"
version = "0.1.0"
description = "Refactored DDM release candidate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "PyJWT>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    # ── Phase 4: PostgreSQL async stack ──────────────────────────────────────
    "sqlmodel>=0.0.22,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    # aiosqlite provides a SQLite backend for the async engine used in tests
    "aiosqlite>=0.20,<1.0",
    # ── Phase 6: Distributed task queue & deep learning CV pipeline ──────────
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "mediapipe>=0.10,<1.0",
    "opencv-python-headless>=4.9,<5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0"
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "functional: API-level functional tests",
    "e2e: end-to-end workflow tests",
    "regression: regression tests for known calculation outputs"
]
