# Explicit project name ensures the data volume is always named "ddm-v2_ddm-v2-data",
# which is referenced as an external volume in docker-compose.tools.yml (db-backup).
name: ddm-v2

services:
  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ddm-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddm
      POSTGRES_PASSWORD: ddm_secret
      POSTGRES_DB: ddm
    volumes:
      - ddm-v2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddm -d ddm"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ddm_net
  # ── Redis 7 (Celery message broker) ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ddm-v2-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ddm_net
  ddm-v2:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ddm-v2:202603-rc1
    container_name: ddm-v2
    restart: unless-stopped
    ports:
      - "${DDM_PORT:-8000}:8000"
    environment:
      DDM_ROOT_DIR: /app
      DDM_DATA_DIR: /app/data
      DDM_DB_PATH: /app/data/runtime-db.json
      DDM_DATABASE_URL: postgresql+asyncpg://ddm:ddm_secret@postgres:5432/ddm
      DDM_SECRET_KEY: ${DDM_SECRET_KEY:-ddm-v2-release-candidate-202603-rc1-secure-key}
      DDM_CORS_ALLOW_ORIGINS: ${DDM_CORS_ALLOW_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DDM_CORS_ALLOW_METHODS: ${DDM_CORS_ALLOW_METHODS:-GET,POST,PUT,DELETE}
      DDM_CORS_ALLOW_HEADERS: ${DDM_CORS_ALLOW_HEADERS:-Authorization,Content-Type}
      DDM_CORS_ALLOW_CREDENTIALS: ${DDM_CORS_ALLOW_CREDENTIALS:-true}
    volumes:
      - ddm-v2-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ddm_net

  # ── Celery Worker (Deep Learning CV Pipeline) ────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ddm-v2:202603-rc1
    container_name: ddm-v2-celery-worker
    restart: unless-stopped
    command: celery -A src.ddm_v2.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      DDM_ROOT_DIR: /app
      DDM_DATA_DIR: /app/data
      DDM_DATABASE_URL: postgresql+asyncpg://ddm:ddm_secret@postgres:5432/ddm
      DDM_CELERY_BROKER_URL: redis://redis:6379/0
      DDM_CELERY_RESULT_BACKEND: redis://redis:6379/1
      DDM_SECRET_KEY: ${DDM_SECRET_KEY:-ddm-v2-release-candidate-202603-rc1-secure-key}
    volumes:
      - ddm-v2-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ddm_net

volumes:
  ddm-v2-data:
  ddm-v2-pgdata:

networks:
  ddm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
