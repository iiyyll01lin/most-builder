# ─── PostgreSQL 15 StatefulSet ────────────────────────────────────────────────
#
# Uses a StatefulSet (not Deployment) so that:
#   1. Each replica gets its own stable persistent volume via volumeClaimTemplates.
#   2. Pod identity is stable across restarts (postgres-0, postgres-1, …).
#
# For a single-instance setup (most common in early K8s deployments) set
# replicas: 1.  For HA, use the Bitnami PostgreSQL HA Helm chart or Crunchy PGO
# instead of scaling this manifest directly — PostgreSQL requires a primary /
# replica topology that a plain Deployment cannot provide safely.
#
# Storage:
#   volumeClaimTemplates provisions a PersistentVolumeClaim automatically for
#   each pod.  On AWS EKS set storageClassName: gp2 (or gp3).
#   On GKE use standard-rwo.  On bare metal use your local StorageClass.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ddm-v2
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ddm-v2
spec:
  # Headless service — DNS resolves to pod IPs directly (required by StatefulSet)
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ddm-v2
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ddm-v2
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ddm-v2
    spec:
      # Terminate gracefully — give Postgres time to finish checkpointing
      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 999            # postgres group — owns the mounted PVC

      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_USER
              value: ddm
            - name: POSTGRES_DB
              value: ddm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ddm-v2-secrets
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ddm", "-d", "ddm"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ddm", "-d", "ddm"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data

  # This block creates a PVC per pod automatically — no manual PV creation needed.
  # Adjust storageClassName and storage size to suit your cloud provider and load.
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: ddm-v2
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2    # AWS EKS: gp2 / gp3.  GKE: standard-rwo
        resources:
          requests:
            storage: 10Gi
