# ─── Frontend (Nginx) Deployment + Service ────────────────────────────────────
#
# Serves the Vite-built React SPA from the multi-stage Nginx image.
# Nginx proxies /api/* and WebSocket routes to the backend Service internally.
# The Ingress in ingress.yaml handles external TLS termination.
#
# Stateless — scale replicas freely.  No PVC required.
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ddm-v2
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ddm-v2
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ddm-v2
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ddm-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: ddm-v2
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          # Replace with your registry path, e.g.:
          #   123456789.dkr.ecr.us-east-1.amazonaws.com/ddm-v2-frontend:202603-rc1
          image: ddm-v2-frontend:202603-rc1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
