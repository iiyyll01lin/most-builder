# ─── Mosquitto configuration — DDM-v2 factory IoT broker ────────────────────
#
# Minimal anonymous setup suitable for an internal, network-isolated deployment.
# For production beyond a factory LAN, add TLS and password_file authentication.

listener 1883
allow_anonymous true

# Persist messages to disk so events survive broker restarts
persistence true
persistence_location /mosquitto/data/

# Log to stdout (captured by Docker)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
