# ─── DDM-V2 — Full CI/CD Pipeline ────────────────────────────────────────────
#
# Triggered on every push to `main` / `202603-rc1` and on every Pull Request.
# Paths filter ensures the pipeline only fires when ddm-v2/* is touched.
#
# Stage order (each stage must pass before the next begins):
#   1. lint        — Ruff (Python)  +  TSC --noEmit (TypeScript frontend)
#   2. typecheck   — Mypy strict pass on the src/ package
#   3. test        — Pytest with live PostgreSQL 15 + Redis 7 service containers
#   4. e2e         — Playwright Chromium against the full Dockerised stack
#
# Caching strategy:
#   • pip   — ~/.cache/pip keyed on pyproject.toml hash
#   • npm   — npm cache keyed on package-lock.json hashes
#   • Playwright browsers — ~/.cache/ms-playwright keyed on Playwright version

name: CI — DDM IE/PE Console

on:
  push:
    branches:
      - main
      - 202603-rc1
    paths:
      - 'ddm-v2/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ddm-v2/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: ddm-v2

# Cancel any in-progress run for the same PR/branch to avoid waste
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Stage 1a: Python lint (Ruff)
  # ────────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint — Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('ddm-v2/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Ruff
        run: pip install "ruff>=0.4,<1.0"

      - name: Run Ruff
        run: ruff check src/ tests/

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 1b: TypeScript lint / type-check (frontend)
  # ────────────────────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint — TSC (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ddm-v2/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ddm-v2/frontend
        run: npm ci

      - name: TypeScript type-check (frontend)
        working-directory: ddm-v2/frontend
        run: npm run typecheck

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 2: Mypy strict type-check
  # ────────────────────────────────────────────────────────────────────────────
  typecheck-python:
    name: Type-check — Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mypy-${{ runner.os }}-${{ hashFiles('ddm-v2/pyproject.toml') }}
          restore-keys: pip-mypy-${{ runner.os }}-

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Run Mypy
        run: mypy src/

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 3: Backend unit / integration tests (Pytest)
  #   • Uses GitHub Actions service containers for PostgreSQL 15 + Redis 7
  #   • SQLite is NOT used here — tests run against real Postgres like production
  # ────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test — Pytest (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck-python]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ddm
          POSTGRES_PASSWORD: ddm_secret
          POSTGRES_DB: ddm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddm -d ddm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        # Inline config: allow_anonymous + listener 1883
        options: >-
          --health-cmd "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -i hc -W 3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ hashFiles('ddm-v2/pyproject.toml') }}
          restore-keys: pip-test-${{ runner.os }}-

      - name: Install package + test dependencies
        run: pip install -e ".[dev]"

      - name: Run Pytest
        env:
          DDM_DATABASE_URL: postgresql+asyncpg://ddm:ddm_secret@localhost:5432/ddm_test
          DDM_CELERY_BROKER_URL: redis://localhost:6379/0
          DDM_CELERY_RESULT_BACKEND: redis://localhost:6379/1
          DDM_MQTT_BROKER_HOST: localhost
          DDM_MQTT_BROKER_PORT: 1883
          DDM_SECRET_KEY: ci-test-secret-key-not-for-production
          DDM_ROOT_DIR: /tmp/ddm-ci
          DDM_DATA_DIR: /tmp/ddm-ci/data
        run: |
          mkdir -p /tmp/ddm-ci/data
          pytest tests/ -v --tb=short --timeout=60

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 4: E2E tests (Playwright Chromium against full Docker stack)
  # ────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ddm-v2/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: ddm-v2/e2e
        run: npm ci

      # Cache Playwright browser binaries keyed on the installed @playwright/test version
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ddm-v2/e2e/package-lock.json') }}

      - name: Install Playwright browsers (Chromium only)
        working-directory: ddm-v2/e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit path)
        working-directory: ddm-v2/e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Type-check E2E tests
        working-directory: ddm-v2/e2e
        run: npx tsc --noEmit

      - name: Build Docker images
        run: docker compose -f docker-compose.test.yml build

      - name: Start full stack
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for backend health
        run: |
          echo "Waiting for backend /api/v1/health..."
          timeout 120 bash -c \
            'until curl -sf http://localhost:8000/api/v1/health; do sleep 3; done'

      - name: Wait for frontend Nginx
        run: |
          echo "Waiting for frontend..."
          timeout 30 bash -c \
            'until curl -sf http://localhost:4000; do sleep 2; done'

      - name: Run Playwright E2E suite
        working-directory: ddm-v2/e2e
        env:
          E2E_SKIP_DOCKER: 'true'
          E2E_BASE_URL: 'http://localhost:4000'
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: ddm-v2/e2e/playwright-report/
          retention-days: 14

      - name: Upload test screenshots / videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: ddm-v2/e2e/test-results/
          retention-days: 7

      - name: Tear down Docker stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
