# ─── DDM-V2 E2E Pipeline ─────────────────────────────────────────────────────
#
# Triggered on every push / PR that touches ddm-v2/ or the workflow file itself.
# Steps:
#   1. Checkout the repo
#   2. Install Playwright + browsers in the e2e directory
#   3. Spin up the full docker-compose.test.yml stack (backend + frontend)
#   4. Wait for the stack to become healthy
#   5. Run the Playwright E2E test suite
#   6. Upload the HTML report as an artifact on failure
#
# Note: The globalSetup script in playwright.config.ts also calls
# `docker compose up` as a safety net; the explicit step here ensures
# the images are built before Playwright spawns and avoids timeout races.

name: E2E Tests — DDM IE/PE Console

on:
  push:
    branches:
      - '**'
    paths:
      - 'ddm-v2/**'
      - '.github/workflows/e2e-pipeline.yml'
  pull_request:
    paths:
      - 'ddm-v2/**'
      - '.github/workflows/e2e-pipeline.yml'

defaults:
  run:
    working-directory: ddm-v2

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js for Playwright ─────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ddm-v2/e2e/package-lock.json

      # ── 3. Install Playwright and its browser binaries ────────────────────────
      - name: Install E2E dependencies
        working-directory: ddm-v2/e2e
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: ddm-v2/e2e
        run: npx playwright install --with-deps chromium

      # ── 4. TypeScript dry-run for the test suite ──────────────────────────────
      - name: Type-check E2E tests
        working-directory: ddm-v2/e2e
        run: npx tsc --noEmit

      # ── 5. Build and start the integrated stack ───────────────────────────────
      - name: Build Docker images
        run: docker compose -f docker-compose.test.yml build --no-cache

      - name: Start full stack (backend + frontend)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend..."
          timeout 90 bash -c \
            'until curl -sf http://localhost:8000/api/v1/health; do sleep 3; done'

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend Nginx..."
          timeout 30 bash -c \
            'until curl -sf http://localhost:4000; do sleep 2; done'

      # ── 6. Run Playwright E2E suite ───────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: ddm-v2/e2e
        env:
          # Skip the globalSetup docker-compose logic — stack is already up
          E2E_SKIP_DOCKER: 'true'
          E2E_BASE_URL: 'http://localhost:4000'
        run: npx playwright test

      # ── 7. Collect and upload artefacts ──────────────────────────────────────
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: ddm-v2/e2e/playwright-report/
          retention-days: 14

      - name: Upload test screenshots / videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: ddm-v2/e2e/test-results/
          retention-days: 7

      # ── 8. Always tear down the stack ────────────────────────────────────────
      - name: Tear down Docker stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
